esphome:
  name: touch-panel
  build_path: build
  
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: WARN

api:

web_server:
  port: 80

ota:
  - platform: esphome
    version: 2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

light:
  - platform: esp32_rmt_led_strip
    name: "LED Strip"
    pin: GPIO4
    num_leds: 90
    rgb_order: GRB
    chipset: WS2812
    restore_mode: RESTORE_DEFAULT_OFF

    effects:
      - addressable_rainbow:
      - addressable_color_wipe:
      - addressable_scan:
      - addressable_twinkle:
      - addressable_fireworks:
