esphome:
  name: led_strip
  build_path: build
  on_boot:
    priority: 600
    then:
      - number.set:
          id: ui_target_r
          value: !lambda "return id(target_r);"
      - number.set:
          id: ui_target_g
          value: !lambda "return id(target_g);"
      - number.set:
          id: ui_target_b
          value: !lambda "return id(target_b);"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: WARN

api:

web_server:
  port: 80

ota:
  - platform: esphome
    version: 2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: target_r
    type: int
    restore_value: true
    initial_value: '255'
  - id: target_g
    type: int
    restore_value: true
    initial_value: '255'
  - id: target_b
    type: int
    restore_value: true
    initial_value: '255'

number:
  - platform: template
    name: "Target R"
    id: ui_target_r
    min_value: 0
    max_value: 255
    step: 1
    mode: slider
    restore_value: true
    initial_value: 255
    set_action:
      - lambda: |-
          id(target_r) = (int)x;

  - platform: template
    name: "Target G"
    id: ui_target_g
    min_value: 0
    max_value: 255
    step: 1
    mode: slider
    restore_value: true
    initial_value: 255
    set_action:
      - lambda: |-
          id(target_g) = (int)x;

  - platform: template
    name: "Target B"
    id: ui_target_b
    min_value: 0
    max_value: 255
    step: 1
    mode: slider
    restore_value: true
    initial_value: 255
    set_action:
      - lambda: |-
          id(target_b) = (int)x;

# Egale kleur light (gewoon RGB bediening)
light:
  - platform: esp32_rmt_led_strip
    name: "LED Strip"
    id: led_strip_light
    pin: GPIO4
    num_leds: 90
    rgb_order: GRB
    chipset: WS2812
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 1s

    effects:
      - addressable_lambda:
          name: "Egale Kleur"
          update_interval: 50ms
          lambda: |-
            for (int i = 0; i < it.size(); i++)
              it[i] = Color(
                int(id(target_r)),
                int(id(target_g)),
                int(id(target_b))
              );

      - addressable_rainbow:
      - addressable_color_wipe:
      - addressable_scan:
      - addressable_twinkle:
      - addressable_fireworks:
      - addressable_random_twinkle:
      - pulse:
      - strobe:
      - flicker:

      - addressable_lambda:
          name: "Smooth Fade"
          update_interval: 50ms
          lambda: |-
            static float r = 0;
            static float g = 85;
            static float b = 170;
            r += 1; if(r > 255) r = 0;
            g += 1; if(g > 255) g = 0;
            b += 1; if(b > 255) b = 0;
            for(int i=0; i<it.size(); i++)
              it[i] = Color(r,g,b);

      - addressable_lambda:
          name: "Larson Scanner"
          update_interval: 30ms
          lambda: |-
            static int pos = 0;
            static int dir = 1;
            for(int i=0; i<it.size(); i++)
              it[i] = Color(0,0,0);
            it[pos] = Color(255,0,0);
            pos += dir;
            if(pos >= it.size()-1 || pos <= 0) dir = -dir;
