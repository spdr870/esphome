esphome:
  name: "allotment"
  friendly_name: "allotment"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
  level: WARN
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: LIGHT
  ap:
    ssid: "Devboard Fallback Hotspot"

api:

ota:
  - platform: esphome

web_server:
  port: 80

sensor:
  - platform: dht
    pin: GPIO17
    model: DHT11
    temperature:
      name: "Allotment Air Temperature"
      id: allotment_air_temperature
    humidity:
      name: "Allotment Air Humidity"
      id: allotment_air_humidity
    update_interval: 10s

light:
  - platform: esp32_rmt_led_strip
    id: onboard_rgb
    name: "Onboard RGB"
    pin: GPIO48
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

deep_sleep:
  id: deep_sleep_control
  run_duration: 30s
  sleep_duration: 10min
  wakeup_pin:
    number: GPIO20
    inverted: true
  wakeup_pin_mode: KEEP_AWAKE
