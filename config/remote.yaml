esphome:
  name: remote
  friendly_name: Remote

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: ERROR

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 20dB
  ap:
    ssid: "Servotest Fallback Hotspot"

captive_portal:

web_server:
  port: 80

espnow:
  id: espnow_component
  auto_add_peer: true
  peers:
    - 94:51:DC:4B:66:90

text_sensor:
  - platform: wifi_info
    mac_address:
      name: "WiFi MAC Address"

globals:
  - id: last_x_sent
    type: float
    restore_value: no
    initial_value: "999.0"

  - id: last_y_sent
    type: float
    restore_value: no
    initial_value: "999.0"

sensor:
  - platform: adc
    pin: GPIO32
    id: joystick_x_raw
    name: "Joystick X Voltage"
    update_interval: 20ms
    attenuation: auto
    accuracy_decimals: 3

  - platform: adc
    pin: GPIO33
    id: joystick_y_raw
    name: "Joystick Y Voltage"
    update_interval: 20ms
    attenuation: auto
    accuracy_decimals: 3



  - platform: template
    name: "Joystick X Axis"
    id: joystick_x_axis
    update_interval: 50ms
    accuracy_decimals: 3
    lambda: |-
      const float v = id(joystick_x_raw).state;
      const float min_v = 0.1f;
      const float max_v = 3.3f;
      float x = ((v - min_v) / (max_v - min_v)) * 2.0f - 1.0f;
      if (x > 1.0f) x = 1.0f;
      if (x < -1.0f) x = -1.0f;
      if (x > -0.1f && x < 0.1f) x = 0.0f;
      return x;

  - platform: template
    name: "Joystick Y Axis"
    id: joystick_y_axis
    update_interval: 50ms
    accuracy_decimals: 3
    lambda: |-
      const float v = id(joystick_y_raw).state;
      const float min_v = 0.4f;
      const float max_v = 3.3f;
      float y = ((v - min_v) / (max_v - min_v)) * 2.0f - 1.0f;
      if (y > 1.0f) y = 1.0f;
      if (y < -1.0f) y = -1.0f;
      if (y > -0.1f && y < 0.1f) y = 0.0f;
      return y;


interval:
  - interval: 20ms
    startup_delay: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(joystick_x_axis).has_state() || !id(joystick_y_axis).has_state())
                return false;

              float x = id(joystick_x_axis).state;
              float y = id(joystick_y_axis).state;

              if (std::isnan(x) || std::isnan(y) || !std::isfinite(x) || !std::isfinite(y))
                return false;

              return std::fabs(x - id(last_x_sent)) > 0.1f ||
                     std::fabs(y - id(last_y_sent)) > 0.1f;

          then:
            - espnow.send:
                address: 94:51:DC:4B:66:90
                data: !lambda |-
                  float x = id(joystick_x_axis).state;
                  float y = id(joystick_y_axis).state;

                  id(last_x_sent) = x;
                  id(last_y_sent) = y;

                  const int16_t xi = (int16_t) std::lround(x * 1000.0f);
                  const int16_t yi = (int16_t) std::lround(y * 1000.0f);

                  std::vector<uint8_t> payload;
                  payload.reserve(4);
                  payload.push_back((xi >> 8) & 0xFF);
                  payload.push_back(xi & 0xFF);
                  payload.push_back((yi >> 8) & 0xFF);
                  payload.push_back(yi & 0xFF);

                  return payload;
