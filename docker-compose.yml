services:
  esphome:
    container_name: esphome
    image: esphome/esphome:2026.11.0-dev20261014
    #image: ghcr.io/esphome/esphome
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: always
    privileged: true
    network_mode: host
    environment:
      - USERNAME=henk
      - PASSWORD=henk
